<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>勤怠打刻</title>

<meta name="theme-color" content="#2C6E7F">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
}

body {
  font-family:
    "M PLUS Rounded 1c",
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #eef7f8 0%,
      #dceff2 100%
    );

  color: #25444b;
  min-height: 100vh;
}

/* =========================
   全体
========================= */

.app {
  width: 100%;
  max-width: 760px;
  margin: 0 auto;
  padding: 20px 16px 40px;
}

/* =========================
   ヘッダー
========================= */

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
}

.logo-area {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo-icon {
  width: 48px;
  height: 48px;
  border-radius: 16px;

  background: #2C6E7F;
  color: white;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 24px;
  box-shadow:
    0 5px 14px rgba(44,110,127,.22);
}

.title-area h1 {
  margin: 0;
  font-size: 22px;
  font-weight: 800;
  color: #245664;
}

.title-area p {
  margin: 2px 0 0;
  font-size: 12px;
  color: #6a858b;
}

/* =========================
   時計
========================= */

.clock-card {
  background: rgba(255,255,255,.86);
  border-radius: 24px;
  padding: 18px 20px;
  margin-bottom: 16px;

  box-shadow:
    0 8px 24px rgba(44,110,127,.12);

  text-align: center;
}

.clock-date {
  font-size: 14px;
  color: #6b858b;
  margin-bottom: 2px;
}

.clock-time {
  font-size: 42px;
  line-height: 1.1;
  font-weight: 800;
  letter-spacing: 2px;
  color: #245d6d;
}

/* =========================
   カード
========================= */

.card {
  background: rgba(255,255,255,.92);
  border-radius: 24px;
  padding: 20px;

  margin-bottom: 16px;

  box-shadow:
    0 8px 24px rgba(44,110,127,.10);
}

.section-title {
  display: flex;
  align-items: center;
  gap: 8px;

  font-size: 15px;
  font-weight: 800;
  color: #245664;

  margin-bottom: 13px;
}

.section-number {
  width: 26px;
  height: 26px;
  border-radius: 50%;

  display: flex;
  align-items: center;
  justify-content: center;

  background: #2C6E7F;
  color: white;

  font-size: 13px;
  font-weight: 800;
}

/* =========================
   店舗ボタン
========================= */

.store-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.store-btn {
  border: none;
  border-radius: 16px;

  padding: 15px 8px;

  background: #eef5f6;
  color: #40646c;

  font-family: inherit;
  font-size: 15px;
  font-weight: 700;

  cursor: pointer;

  transition:
    transform .15s,
    background .15s,
    box-shadow .15s;
}

.store-btn:hover {
  transform: translateY(-1px);
}

.store-btn:active {
  transform: scale(.97);
}

.store-btn.selected {
  background: #2C6E7F;
  color: white;

  box-shadow:
    0 5px 14px rgba(44,110,127,.25);
}

/* =========================
   職員ボタン
========================= */

.employee-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.employee-btn {
  border: none;
  border-radius: 15px;

  min-height: 54px;
  padding: 10px 6px;

  background: #f0f6f7;
  color: #42656d;

  font-family: inherit;
  font-size: 14px;
  font-weight: 700;

  cursor: pointer;

  transition:
    transform .15s,
    background .15s,
    box-shadow .15s;
}

.employee-btn:hover {
  transform: translateY(-1px);
}

.employee-btn:active {
  transform: scale(.97);
}

.employee-btn.selected {
  background: #d8edf1;
  color: #245d6d;

  box-shadow:
    inset 0 0 0 2px #2C6E7F;
}

/* =========================
   選択状態
========================= */

.selected-info {
  text-align: center;

  background: #eef7f8;
  border-radius: 16px;

  padding: 12px 10px;
  margin-bottom: 16px;

  color: #55747b;
  font-size: 13px;
}

.selected-info strong {
  display: block;

  margin-top: 3px;

  font-size: 20px;
  color: #245d6d;
}

/* =========================
   打刻ボタン
========================= */

.punch-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.punch-btn {
  border: none;
  border-radius: 22px;

  min-height: 110px;

  font-family: inherit;
  font-weight: 800;

  cursor: pointer;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  gap: 5px;

  transition:
    transform .15s,
    box-shadow .15s,
    opacity .15s;
}

.punch-btn:hover {
  transform: translateY(-2px);
}

.punch-btn:active {
  transform: scale(.97);
}

.punch-btn .icon {
  font-size: 34px;
  line-height: 1;
}

.punch-btn .main {
  font-size: 18px;
}

.punch-btn .sub {
  font-size: 11px;
  font-weight: 500;
  opacity: .75;
}

/* 出勤 */

.punch-in {
  background: #dff1e9;
  color: #277354;

  box-shadow:
    0 7px 18px rgba(39,115,84,.13);
}

/* 退勤 */

.punch-out {
  background: #e5edf5;
  color: #345f7b;

  box-shadow:
    0 7px 18px rgba(52,95,123,.13);
}

/* 無効 */

.punch-btn.disabled {
  opacity: .42;
  cursor: not-allowed;
  transform: none !important;
}

/* =========================
   ステータス
========================= */

.status {
  margin-top: 14px;

  padding: 12px 14px;

  border-radius: 15px;

  text-align: center;

  background: #f3f8f9;

  color: #617b81;

  font-size: 13px;
  line-height: 1.6;
}

.status.success {
  background: #e6f5ed;
  color: #2d7455;
}

.status.error {
  background: #fbeaea;
  color: #a34c4c;
}

/* =========================
   説明
========================= */

.notice {
  padding: 13px 15px;

  border-radius: 15px;

  background: rgba(255,255,255,.65);

  color: #6c858b;

  font-size: 11px;

  line-height: 1.7;
}

/* =========================
   ローディング
========================= */

.loading {
  position: fixed;

  inset: 0;

  background: rgba(30,70,78,.25);

  display: none;

  align-items: center;
  justify-content: center;

  z-index: 1000;

  backdrop-filter: blur(2px);
}

.loading.show {
  display: flex;
}

.loading-box {
  background: white;

  border-radius: 20px;

  padding: 25px 30px;

  text-align: center;

  box-shadow:
    0 10px 30px rgba(0,0,0,.18);

  color: #45656d;

  font-size: 14px;
}

.spinner {
  width: 34px;
  height: 34px;

  margin: 0 auto 12px;

  border-radius: 50%;

  border: 4px solid #dcecef;
  border-top-color: #2C6E7F;

  animation: spin .8s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

/* =========================
   完了表示
========================= */

.complete {
  text-align: center;

  padding: 18px;

  border-radius: 18px;

  margin-top: 14px;

  display: none;
}

.complete.show {
  display: block;
}

.complete-icon {
  font-size: 38px;
  margin-bottom: 5px;
}

.complete-title {
  font-size: 18px;
  font-weight: 800;

  color: #2d6c54;
}

.complete-time {
  margin-top: 3px;

  font-size: 13px;

  color: #658079;
}

/* =========================
   スマホ
========================= */

@media (max-width: 520px) {

  .app {
    padding:
      14px
      12px
      28px;
  }

  .title-area h1 {
    font-size: 19px;
  }

  .clock-card {
    padding: 16px;
  }

  .clock-time {
    font-size: 36px;
  }

  .card {
    padding: 16px;
    border-radius: 20px;
  }

  .store-grid {
    gap: 8px;
  }

  .store-btn {
    padding: 13px 5px;
    font-size: 14px;
  }

  .employee-grid {
    gap: 8px;
  }

  .employee-btn {
    min-height: 50px;
    font-size: 13px;
  }

  .punch-grid {
    gap: 10px;
  }

  .punch-btn {
    min-height: 100px;
    border-radius: 19px;
  }

  .punch-btn .icon {
    font-size: 30px;
  }

  .punch-btn .main {
    font-size: 17px;
  }

}

/* =========================
   極小画面
========================= */

@media (max-width: 360px) {

  .employee-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .clock-time {
    font-size: 32px;
  }

}

</style>
</head>

<body>

<div class="app">

  <!-- =====================
       ヘッダー
  ====================== -->

  <header class="header">

    <div class="logo-area">

      <div class="logo-icon">
        🕐
      </div>

      <div class="title-area">

        <h1>勤怠打刻</h1>

        <p>
          出勤・退勤を記録します
        </p>

      </div>

    </div>

  </header>


  <!-- =====================
       時計
  ====================== -->

  <section class="clock-card">

    <div
      id="clockDate"
      class="clock-date">
    </div>

    <div
      id="clockTime"
      class="clock-time">
    </div>

  </section>


  <!-- =====================
       店舗選択
  ====================== -->

  <section class="card">

    <div class="section-title">

      <div class="section-number">
        1
      </div>

      店舗を選択

    </div>


    <div
      id="storeGrid"
      class="store-grid">
    </div>

  </section>


  <!-- =====================
       職員選択
  ====================== -->

  <section class="card">

    <div class="section-title">

      <div class="section-number">
        2
      </div>

      職員を選択

    </div>


    <div
      id="employeeGrid"
      class="employee-grid">
    </div>

  </section>


  <!-- =====================
       選択状態
  ====================== -->

  <section
    id="selectedInfo"
    class="selected-info">

    店舗と職員を選択してください

    <strong id="selectedName">
      ―
    </strong>

  </section>


  <!-- =====================
       打刻
  ====================== -->

  <section class="card">

    <div class="section-title">

      <div class="section-number">
        3
      </div>

      打刻

    </div>


    <div class="punch-grid">

      <button
        id="punchIn"
        class="punch-btn punch-in disabled"
        onclick="punch('in')">

        <div class="icon">
          ☀️
        </div>

        <div class="main">
          出勤
        </div>

        <div class="sub">
          出勤時にタップ
        </div>

      </button>


      <button
        id="punchOut"
        class="punch-btn punch-out disabled"
        onclick="punch('out')">

        <div class="icon">
          🌙
        </div>

        <div class="main">
          退勤
        </div>

        <div class="sub">
          退勤時にタップ
        </div>

      </button>

    </div>


    <div
      id="status"
      class="status">

      店舗と職員を選択すると打刻できます。

    </div>


    <div
      id="complete"
      class="complete">

      <div class="complete-icon">
        ✓
      </div>

      <div
        id="completeTitle"
        class="complete-title">
        打刻しました
      </div>

      <div
        id="completeTime"
        class="complete-time">
      </div>

    </div>

  </section>


  <!-- =====================
       注意事項
  ====================== -->

  <div class="notice">

    ・打刻時刻はその時点の時刻で記録されます。<br>
    ・同じ日の出勤・退勤を再度打刻した場合、最新の時刻で更新されます。<br>
    ・打刻データは勤怠管理用スプレッドシートに記録されます。

  </div>

</div>


<!-- =====================
     ローディング
====================== -->

<div
  id="loading"
  class="loading">

  <div class="loading-box">

    <div class="spinner"></div>

    <div>
      打刻を送信しています…
    </div>

  </div>

</div>


<script>

/* =========================================================
   ★★★ Google Apps Script URL ★★★

   ここにGASのウェブアプリURLを設定してください。

   例：
   const GAS_URL =
     'https://script.google.com/macros/s/XXXXXXXXXXXX/exec';

   ※このURLはHTML画面から変更できません。
   ※GASを再デプロイしてURLが変わった場合だけ、
     ここを書き換えてください。
========================================================= */

const GAS_URL =https://script.google.com/macros/s/AKfycbyZ-lB5gCIYEh2bWPfDeFgyyhV_jGPqX7-FwjKAZvw-XLJupW9E0t86l8HYNPoigo1T/exec
  'ここにGASのウェブアプリURLを貼り付け';


/* =========================================================
   店舗
========================================================= */

const STORES = [
  '錦町',
  '入船',
  'メルヘン'
];


/* =========================================================
   店舗カラー
========================================================= */

const STORE_COLORS = {

  '錦町': '#2C6E7F',

  '入船': '#4B7890',

  'メルヘン': '#7A6A91'

};


/* =========================================================
   職員
========================================================= */

const EMP = {

  '錦町': [
    '神野',
    '横川',
    '渡邉',
    '戸澤',
    '松本',
    '根本'
  ],

  '入船': [
    '小野寺',
    '増見',
    '阿部',
    '渡邊'
  ],

  'メルヘン': [
    '齊藤',
    '大橋',
    '福井',
    '小谷'
  ]

};


/* =========================================================
   localStorage
========================================================= */

const PUNCH_KEY =
  '勤怠_打刻状態';

const LAST_KEY =
  '勤怠_最後の選択';


/* =========================================================
   現在の選択
========================================================= */

let currentStore = '';

let currentName = '';


/* =========================================================
   DOM取得
========================================================= */

function $(id) {

  return document.getElementById(id);

}


/* =========================================================
   今日の日付
========================================================= */

function getDateString() {

  const now = new Date();

  const y =
    now.getFullYear();

  const m =
    String(now.getMonth() + 1)
      .padStart(2, '0');

  const d =
    String(now.getDate())
      .padStart(2, '0');

  return `${y}-${m}-${d}`;

}


/* =========================================================
   時刻
========================================================= */

function getTimeString() {

  const now = new Date();

  const h =
    String(now.getHours())
      .padStart(2, '0');

  const m =
    String(now.getMinutes())
      .padStart(2, '0');

  const s =
    String(now.getSeconds())
      .padStart(2, '0');

  return `${h}:${m}:${s}`;

}


/* =========================================================
   時計表示
========================================================= */

function updateClock() {

  const now = new Date();


  const year =
    now.getFullYear();

  const month =
    now.getMonth() + 1;

  const day =
    now.getDate();


  const weekdays = [
    '日',
    '月',
    '火',
    '水',
    '木',
    '金',
    '土'
  ];


  const weekday =
    weekdays[now.getDay()];


  $('clockDate').textContent =
    `${year}年${month}月${day}日（${weekday}）`;


  $('clockTime').textContent =
    `${String(now.getHours()).padStart(2,'0')}:` +
    `${String(now.getMinutes()).padStart(2,'0')}:` +
    `${String(now.getSeconds()).padStart(2,'0')}`;

}


/* =========================================================
   店舗ボタン生成
========================================================= */

function renderStores() {

  const grid =
    $('storeGrid');

  grid.innerHTML = '';


  STORES.forEach(store => {

    const button =
      document.createElement('button');

    button.className =
      'store-btn';


    button.textContent =
      store;


    if (store === currentStore) {

      button.classList.add(
        'selected'
      );

    }


    button.onclick =
      () => selectStore(store);


    grid.appendChild(button);

  });

}


/* =========================================================
   店舗選択
========================================================= */

function selectStore(store) {

  currentStore =
    store;

  currentName =
    '';


  localStorage.setItem(
    LAST_KEY,
    JSON.stringify({
      store: currentStore,
      name: ''
    })
  );


  renderStores();

  renderEmployees();

  updateSelected();

  updateStatus();

}


/* =========================================================
   職員ボタン生成
========================================================= */

function renderEmployees() {

  const grid =
    $('employeeGrid');

  grid.innerHTML = '';


  if (!currentStore) {

    return;

  }


  const employees =
    EMP[currentStore] || [];


  employees.forEach(name => {

    const button =
      document.createElement('button');

    button.className =
      'employee-btn';


    button.textContent =
      name;


    if (name === currentName) {

      button.classList.add(
        'selected'
      );

    }


    button.onclick =
      () => selectEmployee(name);


    grid.appendChild(button);

  });

}


/* =========================================================
   職員選択
========================================================= */

function selectEmployee(name) {

  currentName =
    name;


  localStorage.setItem(
    LAST_KEY,
    JSON.stringify({
      store: currentStore,
      name: currentName
    })
  );


  renderEmployees();

  updateSelected();

  updateStatus();

}


/* =========================================================
   選択状態表示
========================================================= */

function updateSelected() {

  const info =
    $('selectedInfo');

  const name =
    $('selectedName');


  if (
    currentStore &&
    currentName
  ) {

    name.textContent =
      `【${currentStore}】${currentName}`;

  } else {

    name.textContent =
      '―';

  }

}


/* =========================================================
   打刻ボタン状態
========================================================= */

function updatePunchButtons() {

  const enabled =
    !!(
      currentStore &&
      currentName
    );


  const inBtn =
    $('punchIn');

  const outBtn =
    $('punchOut');


  if (enabled) {

    inBtn.classList.remove(
      'disabled'
    );

    outBtn.classList.remove(
      'disabled'
    );

  } else {

    inBtn.classList.add(
      'disabled'
    );

    outBtn.classList.add(
      'disabled'
    );

  }

}


/* =========================================================
   ステータス
========================================================= */

function updateStatus() {

  const status =
    $('status');


  status.className =
    'status';


  if (!currentStore) {

    status.textContent =
      '店舗を選択してください。';

    updatePunchButtons();

    return;

  }


  if (!currentName) {

    status.textContent =
      '職員を選択してください。';

    updatePunchButtons();

    return;

  }


  status.textContent =
    `【${currentStore}】${currentName} さんの打刻ができます。`;


  updatePunchButtons();

}


/* =========================================================
   ローディング
========================================================= */

function showLoading() {

  $('loading')
    .classList
    .add('show');

}


function hideLoading() {

  $('loading')
    .classList
    .remove('show');

}


/* =========================================================
   ステータス変更
========================================================= */

function setStatus(
  message,
  type = ''
) {

  const status =
    $('status');


  status.textContent =
    message;


  status.className =
    'status';


  if (type) {

    status.classList.add(
      type
    );

  }

}


/* =========================================================
   完了表示
========================================================= */

function showComplete(
  action,
  time
) {

  const complete =
    $('complete');


  const title =
    $('completeTitle');


  const completeTime =
    $('completeTime');


  if (action === 'in') {

    title.textContent =
      '出勤を記録しました';

  } else {

    title.textContent =
      '退勤を記録しました';

  }


  completeTime.textContent =
    `${currentName}　${time}`;


  complete.classList.add(
    'show'
  );


  setTimeout(() => {

    complete.classList.remove(
      'show'
    );

  }, 4000);

}


/* =========================================================
   打刻
========================================================= */

async function punch(action) {

  /* -------------------------
     選択チェック
  ------------------------- */

  if (
    !currentStore ||
    !currentName
  ) {

    setStatus(
      '店舗と職員を選択してください。',
      'error'
    );

    return;

  }


  /* -------------------------
     GAS URLチェック
  ------------------------- */

  if (
    !GAS_URL ||
    GAS_URL.indexOf(
      'https://script.google.com/'
    ) !== 0
  ) {

    setStatus(
      'GASのURLが設定されていません。',
      'error'
    );

    return;

  }


  /* -------------------------
     打刻時刻
  ------------------------- */

  const date =
    getDateString();

  const time =
    getTimeString();


  /* -------------------------
     送信データ
  ------------------------- */

  const payload = {

    date: date,

    store: currentStore,

    name: currentName,

    in: '',

    out: ''

  };


  if (action === 'in') {

    payload.in =
      time;

  } else {

    payload.out =
      time;

  }


  /* -------------------------
     二重送信防止
  ------------------------- */

  const buttons = [
    $('punchIn'),
    $('punchOut')
  ];


  buttons.forEach(button => {

    button.disabled = true;

  });


  showLoading();


  setStatus(
    action === 'in'
      ? '出勤を送信しています…'
      : '退勤を送信しています…'
  );


  try {

    /* =====================================================
       GASへPOST
       
       URLはHTML上部のGAS_URLを使用
       ===================================================== */

    const response =
      await fetch(
        GAS_URL,
        {

          method: 'POST',

          mode: 'cors',

          redirect: 'follow',

          headers: {
            'Content-Type':
              'text/plain;charset=utf-8'
          },

          body:
            JSON.stringify(payload)

        }
      );


    /* -------------------------
       HTTPエラー
    ------------------------- */

    if (!response.ok) {

      throw new Error(
        `HTTP ${response.status}`
      );

    }


    /* -------------------------
       GASからの返答
    ------------------------- */

    let result = null;


    try {

      result =
        await response.json();

    } catch (jsonError) {

      /*
       * GAS側がJSONではなく
       * 空レスポンスを返す場合でも、
       * HTTP通信自体が成功していれば
       * 打刻成功として扱います。
       */

      result = null;

    }


    /* -------------------------
       GAS側エラー
    ------------------------- */

    if (
      result &&
      result.success === false
    ) {

      throw new Error(
        result.message ||
        'GAS側でエラーが発生しました。'
      );

    }


    /* -------------------------
       成功
    ------------------------- */

    localStorage.setItem(
      PUNCH_KEY,
      JSON.stringify({
        date: date,
        store: currentStore,
        name: currentName,
        action: action,
        time: time
      })
    );


    hideLoading();


    showComplete(
      action,
      time
    );


    setStatus(
      action === 'in'
        ? '出勤を記録しました。'
        : '退勤を記録しました。',
      'success'
    );


    /*
     * ★重要
     *
     * ここではページを
     * reload()しません。
     *
     * そのため、
     * 「出勤を押したあと更新しないと
     * 退勤ボタンが使えない」
     * という問題を防ぎます。
     */

    updatePunchButtons();


  } catch (error) {

    console.error(
      '打刻エラー:',
      error
    );


    hideLoading();


    setStatus(
      `送信に失敗しました。${error.message || ''}`,
      'error'
    );


  } finally {

    /*
     * ボタンを再び使用可能にする
     */

    buttons.forEach(button => {

      button.disabled =
        false;

    });


    updatePunchButtons();

  }

}


/* =========================================================
   初期化
========================================================= */

function init() {

  /* -------------------------
     最後の選択を復元
  ------------------------- */

  try {

    const saved =
      localStorage.getItem(
        LAST_KEY
      );


    if (saved) {

      const data =
        JSON.parse(saved);


      if (
        data &&
        STORES.includes(
          data.store
        )
      ) {

        currentStore =
          data.store;


        if (
          data.name &&
          EMP[currentStore] &&
          EMP[currentStore].includes(
            data.name
          )
        ) {

          currentName =
            data.name;

        }

      }

    }

  } catch (error) {

    console.warn(
      '保存状態の復元に失敗:',
      error
    );

  }


  renderStores();

  renderEmployees();

  updateSelected();

  updateStatus();

  updateClock();

}


/* =========================================================
   時計開始
========================================================= */

setInterval(
  updateClock,
  1000
);


/* =========================================================
   起動
========================================================= */

document.addEventListener(
  'DOMContentLoaded',
  init
);

</script>

</body>
</html>
