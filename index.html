<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2C6E7F">
<title>勤怠打刻</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}

:root{
  --bg:#1f5c6d;
  --bg2:#2f7c8d;
  --card:#3e8798;
  --card-border:#4f97a6;
  --clock-bg:#10181b;
  --clock-text:#f4fbfd;
  --btn:#8fcbe0;
  --btn-text:#123642;
  --btn-selected:#f2a35c;
  --btn-selected-text:#3a2000;
  --btn-disabled:#5f97a4;
  --btn-disabled-text:#9fc3cb;
  --out:#e8747a;
  --icon-mute:#7fa9ae;
  --icon-lock:#3fae64;
  --text-soft:#d9eef2;
  --success-bg:#1f4f3d;
  --success-text:#bdf0d3;
  --success-border:#3f9c72;
  --err-bg:#5a2430;
  --err-text:#ffd3d8;
  --err-border:#c65361;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:40px 16px;
  background:radial-gradient(120% 140% at 20% -10%, var(--bg2), var(--bg) 60%);
  color:var(--text-soft);
  font-family:'M PLUS Rounded 1c','Noto Sans JP',-apple-system,BlinkMacSystemFont,sans-serif;
}

.app{
  width:100%;
  max-width:460px;
  background:var(--card);
  border:1px solid var(--card-border);
  border-radius:24px;
  padding:22px;
  box-shadow:0 20px 50px rgba(0,0,0,.25);
}

.head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:16px;
}

h1{
  font-size:20px;
  font-weight:800;
  margin:0;
  color:#fff;
  letter-spacing:.02em;
}

.icons{
  display:flex;
  gap:8px;
}

.iconbtn{
  width:38px;
  height:38px;
  border:0;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  color:#fff;
}

.iconbtn.mute{ background:var(--icon-mute); }
.iconbtn.lock{ background:var(--icon-lock); }
.iconbtn svg{ width:18px; height:18px; }

.clock{
  background:var(--clock-bg);
  border-radius:16px;
  padding:26px 16px;
  text-align:center;
  margin-bottom:18px;
}

.clock .date{
  font-size:17px;
  color:#9fb4b8;
  margin-bottom:4px;
  letter-spacing:.04em;
}

.clock .time{
  font-size:64px;
  font-weight:800;
  color:var(--clock-text);
  letter-spacing:.02em;
  font-variant-numeric:tabular-nums;
}

.steplabel{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:15px;
  font-weight:700;
  color:#eafbff;
  margin-bottom:12px;
}

.backbtn{
  border:0;
  background:none;
  color:#eafbff;
  font-size:15px;
  font-weight:700;
  padding:4px 2px;
  cursor:pointer;
  text-decoration:underline;
  text-underline-offset:2px;
}

.storegrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.storebtn{
  height:90px;
  border:0;
  border-radius:14px;
  background:var(--btn);
  color:#fff;
  font-size:26px;
  font-weight:800;
  cursor:pointer;
  text-shadow:0 1px 3px rgba(0,0,0,.25);
}

.storebtn.selected{
  outline:4px solid var(--btn-selected);
  outline-offset:-4px;
}

.empgrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.empbtn{
  height:76px;
  border:0;
  border-radius:14px;
  background:var(--btn);
  color:#fff;
  font-size:24px;
  font-weight:800;
  cursor:pointer;
  text-shadow:0 1px 3px rgba(0,0,0,.25);
}

.empbtn.selected{
  outline:4px solid var(--btn-selected);
  outline-offset:-4px;
}

.selected-banner{
  background:var(--clock-bg);
  border-radius:14px;
  padding:16px;
  text-align:center;
  margin-bottom:14px;
}

.selected-banner .who{
  font-size:30px;
  font-weight:800;
  color:#fff;
}

.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:11px;
  margin-top:4px;
}

.punch{
  height:120px;
  border:0;
  border-radius:16px;
  color:var(--btn-text);
  font-size:36px;
  font-weight:800;
  background:var(--btn);
  cursor:pointer;
}

.punch.out{
  background:var(--out);
  color:#3a0e10;
}

.punch:disabled{
  background:var(--btn-disabled);
  color:var(--btn-disabled-text);
  cursor:not-allowed;
}

.status{
  font-size:13px;
  line-height:1.7;
  color:var(--text-soft);
  margin-bottom:10px;
  text-align:center;
}

.success{
  background:var(--success-bg);
  border:1px solid var(--success-border);
  border-radius:12px;
  padding:12px;
  font-size:13px;
  color:var(--success-text);
  margin-top:12px;
  line-height:1.7;
}

.err{
  background:var(--err-bg);
  border:1px solid var(--err-border);
  border-radius:12px;
  padding:12px;
  font-size:13px;
  color:var(--err-text);
  margin-top:12px;
  line-height:1.7;
}

.sending{
  text-align:center;
  font-size:13px;
  color:var(--text-soft);
  margin-top:12px;
}

.hidden{ display:none !important; }

.settings{
  margin-top:18px;
  padding-top:16px;
  border-top:1px solid rgba(255,255,255,.15);
}

.settings .label{
  font-size:12px;
  font-weight:700;
  color:#eafbff;
  margin-bottom:7px;
}

.settings .row{
  display:flex;
  gap:7px;
  margin-bottom:8px;
}

.settings input{
  flex:1;
  min-width:0;
  height:42px;
  border:1px solid rgba(255,255,255,.3);
  border-radius:10px;
  padding:0 10px;
  background:rgba(255,255,255,.92);
  font-size:13px;
}

.settings button{
  height:42px;
  border:0;
  border-radius:10px;
  padding:0 14px;
  background:var(--icon-lock);
  color:#fff;
  font-weight:700;
  cursor:pointer;
}

.settings .note{
  font-size:11px;
  line-height:1.7;
  color:#cfe9ee;
}

.settings .urlmsg{
  font-size:12px;
  margin-top:4px;
}
.settings .urlmsg.ok{ color:#bdf0d3; }
.settings .urlmsg.err{ color:#ffd3d8; }
</style>
</head>
<body>
<div class="app">

  <div class="head">
    <h1 id="headerTitle">勤怠打刻</h1>
    <div class="icons">
      <button class="iconbtn mute" id="muteBtn" title="サウンド（未実装）" aria-label="サウンド切替">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 9v6h4l5 5V4L8 9H4z"/>
          <line x1="17" y1="9" x2="22" y2="14"/>
          <line x1="22" y1="9" x2="17" y2="14"/>
        </svg>
      </button>
      <button class="iconbtn lock" id="lockBtn" title="設定" aria-label="設定を開く">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="4" y="11" width="16" height="9" rx="2"/>
          <path d="M8 11V7a4 4 0 0 1 7.5-2"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="clock">
    <div class="date" id="clockDate">----/--/--</div>
    <div class="time" id="clockTime">--:--</div>
  </div>

  <!-- STEP 1：店舗選択 -->
  <section id="storeStep" class="step">
    <div class="steplabel">店舗を選択してください</div>
    <div class="storegrid" id="storeGrid"></div>
  </section>

  <!-- STEP 2：従業員選択 -->
  <section id="empStep" class="step hidden">
    <div class="steplabel">
      <button class="backbtn" id="backToStore">← 店舗を選び直す</button>
    </div>
    <div class="steplabel">名前を選択してください</div>
    <div class="empgrid" id="empGrid"></div>
  </section>

  <!-- STEP 3：出勤・退勤 -->
  <section id="punchStep" class="step hidden">
    <div class="steplabel">
      <button class="backbtn" id="backToEmp">← 名前を選び直す</button>
    </div>
    <div class="selected-banner">
      <div class="who" id="selectedLabel"></div>
    </div>
    <div class="status" id="status"></div>
    <div class="buttons">
      <button id="inBtn" class="punch in" onclick="punch('in')">出勤</button>
      <button id="outBtn" class="punch out" onclick="punch('out')">退勤</button>
    </div>
    <div id="message"></div>
  </section>

  <!-- 設定（鍵アイコンで開閉） -->
  <section id="settingsPanel" class="settings hidden">
    <div class="label">Google Apps Script URL</div>
    <div class="row">
      <input id="gasUrl" placeholder="https://script.google.com/macros/s/.../exec">
      <button onclick="saveUrl()">保存</button>
    </div>
    <div id="urlMsg" class="urlmsg"></div>
    <div class="note" style="margin-top:10px">
      ・出勤・退勤ボタンを押した実際の時刻は、全員分「打刻管理を貼る」シートへ記録されます。<br>
      ・錦町・入船・メルヘンの各店舗シートには、このアプリからは一切書き込みません。<br>
      ・根本さん：店舗シートの出勤時間は「打刻管理を貼る」の出勤打刻を参照する数式で表示されます。<br>
      ・根本さん以外：店舗シートの出勤時間はシフトの数式のままです（打刻の影響を受けません）。
    </div>
  </section>

</div>

<script>
// ============================================================
// 店舗・従業員一覧
// ============================================================
const STORES = ['錦町','入船','メルヘン'];
const STORE_COLORS = {
  '錦町': '#70ad47',
  '入船': '#5b9bd5',
  'メルヘン': '#c27ba0'
};
const EMP = [
  ['錦町','神野'],
  ['錦町','横川'],
  ['錦町','渡邉'],
  ['錦町','戸澤'],
  ['錦町','松本'],
  ['錦町','根本'],
  ['入船','小野寺'],
  ['入船','増見'],
  ['入船','阿部'],
  ['入船','渡邊'],
  ['メルヘン','齊藤'],
  ['メルヘン','大橋'],
  ['メルヘン','福井'],
  ['メルヘン','小谷']
];

const KEY = '勤怠GAS_URL';
const PUNCH_KEY = '勤怠打刻状態';
const LAST_KEY = '勤怠_最終選択';
const $ = id => document.getElementById(id);

let currentStore = null;
let currentName = null;

// ============================================================
// ユーティリティ
// ============================================================
function pad(n){
  return String(n).padStart(2,'0');
}

function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}

function displayNow(){
  const d = new Date();
  $('clockDate').textContent =
    `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())}`;
  $('clockTime').textContent =
    `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  setTimeout(displayNow, 1000);
}

// ============================================================
// 打刻状態の読み書き（localStorage）
// ============================================================
function punchStateKey(store, name, date){
  return `${date}_${store}_${name}`;
}

function getPunchState(store, name, date){
  try{
    const all = JSON.parse(localStorage.getItem(PUNCH_KEY) || '{}');
    return all[punchStateKey(store, name, date)] || { in: false, out: false };
  }catch(_){
    return { in: false, out: false };
  }
}

function setPunchState(store, name, date, partial){
  try{
    const all = JSON.parse(localStorage.getItem(PUNCH_KEY) || '{}');
    const key = punchStateKey(store, name, date);
    all[key] = Object.assign({}, all[key] || {}, partial);
    const cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - 30);
    Object.keys(all).forEach(k => {
      const d = k.split('_')[0];
      if(d && new Date(d) < cutoff) delete all[k];
    });
    localStorage.setItem(PUNCH_KEY, JSON.stringify(all));
  }catch(_){}
}

// ============================================================
// 画面切り替え（店舗選択／従業員選択／出退勤）
// ============================================================
function showStep(step){
  $('storeStep').classList.add('hidden');
  $('empStep').classList.add('hidden');
  $('punchStep').classList.add('hidden');
  $(step).classList.remove('hidden');
}

function renderStoreGrid(){
  const grid = $('storeGrid');
  grid.innerHTML = '';
  STORES.forEach(store => {
    const b = document.createElement('button');
    b.className = 'storebtn';
    b.textContent = store;
    b.style.background = STORE_COLORS[store] || 'var(--btn)';
    if(store === currentStore) b.classList.add('selected');
    b.onclick = () => selectStore(store);
    grid.appendChild(b);
  });
}

function renderEmpGrid(){
  const grid = $('empGrid');
  grid.innerHTML = '';
  EMP.filter(x => x[0] === currentStore).forEach(x => {
    const b = document.createElement('button');
    b.className = 'empbtn';
    b.textContent = x[1];
    b.style.background = STORE_COLORS[currentStore] || 'var(--btn)';
    if(x[1] === currentName) b.classList.add('selected');
    b.onclick = () => selectEmployee(x[1]);
    grid.appendChild(b);
  });
}

function selectStore(store){
  currentStore = store;
  currentName = null;
  $('headerTitle').textContent = store + '調剤薬局';
  renderEmpGrid();
  showStep('empStep');
}

function selectEmployee(name){
  currentName = name;
  localStorage.setItem(LAST_KEY, JSON.stringify({ store: currentStore, name: currentName }));
  $('selectedLabel').textContent = `【${currentStore}】${currentName} さん`;
  showStep('punchStep');
  updateStatus();
}

$('backToStore').onclick = () => {
  currentName = null;
  renderStoreGrid();
  showStep('storeStep');
};

$('backToEmp').onclick = () => {
  renderEmpGrid();
  showStep('empStep');
};

// ============================================================
// ステータス表示・ボタン状態の更新
// ============================================================
function updateStatus(){
  if(!currentStore || !currentName) return;

  const date = todayStr();
  const st = getPunchState(currentStore, currentName, date);

  let msg = '出勤・退勤は何度でも押せます（最新時刻で上書きされます）。';

  if(st.in || st.out){
    const parts = [];
    if(st.in && st.inTime) parts.push(`直近の出勤：${st.inTime}`);
    if(st.out && st.outTime) parts.push(`直近の退勤：${st.outTime}`);
    if(parts.length) msg += ` ${parts.join(' / ')}`;
  }

  $('status').textContent = msg;
  $('inBtn').disabled = false;
  $('outBtn').disabled = false;
}

// ============================================================
// 設定パネル（鍵アイコンで開閉）
// ============================================================
$('lockBtn').onclick = () => {
  $('settingsPanel').classList.toggle('hidden');
};

// ミュートアイコンは現状デザインのみ（機能は未実装）
$('muteBtn').onclick = () => {
  $('muteBtn').classList.toggle('mute');
};

function saveUrl(){
  const url = $('gasUrl').value.trim();
  if(!url){
    $('urlMsg').className = 'urlmsg err';
    $('urlMsg').textContent = 'GAS URLを入力してください。';
    return;
  }
  if(!url.includes('/macros/s/') || !url.endsWith('/exec')){
    $('urlMsg').className = 'urlmsg err';
    $('urlMsg').textContent = 'URLは https://script.google.com/macros/s/.../exec の形式にしてください。';
    return;
  }
  localStorage.setItem(KEY, url);
  $('urlMsg').className = 'urlmsg ok';
  $('urlMsg').textContent = 'GAS URLを保存しました。';
}

// ============================================================
// 打刻
// ============================================================
async function punch(action){
  const url = localStorage.getItem(KEY) || $('gasUrl').value.trim();

  if(!url){
    $('settingsPanel').classList.remove('hidden');
    alert('先にGoogle Apps Script URLを設定してください。');
    return;
  }

  if(!currentStore || !currentName){
    alert('従業員を選択してください。');
    return;
  }

  const store = currentStore;
  const name = currentName;
  const d = new Date();
  const date = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const time = `${pad(d.getHours())}:${pad(d.getMinutes())}`;

  const payload = { date: date, store: store, name: name, in: '', out: '' };

  if(action === 'in'){
    payload.in = time;
  }else{
    payload.out = time;
  }

  $('inBtn').disabled = true;
  $('outBtn').disabled = true;
  $('message').innerHTML =
    `<div class="sending">${action === 'in' ? '出勤' : '退勤'}を送信しています…</div>`;

  try{
    const res = await fetch(url, {
      method: 'POST',
      mode: 'cors',
      redirect: 'follow',
      body: JSON.stringify(payload)
    });

    const text = await res.text();
    let data;
    try{
      data = JSON.parse(text);
    }catch(_){
      throw new Error(
        'GASからの応答がJSONではありません。デプロイ設定・URLを確認してください。本文: ' +
        text.slice(0, 200)
      );
    }

    if(data.status !== 'ok'){
      throw new Error(data.message || 'GAS側でエラーが発生しました');
    }

    if(action === 'in'){
      setPunchState(store, name, date, { in: true, inTime: time });
      $('message').innerHTML =
        `<div class="success">
          出勤を記録しました（最新時刻で上書き）。<br>
          日時：${date} ${time}<br>
          店舗：${store}<br>
          氏名：${name}
        </div>`;
    }else{
      setPunchState(store, name, date, { out: true, outTime: time });
      $('message').innerHTML =
        `<div class="success">
          退勤を記録しました（最新時刻で上書き）。<br>
          日時：${date} ${time}<br>
          店舗：${store}<br>
          氏名：${name}
        </div>`;
    }

    updateStatus();

  }catch(err){
    console.error(err);
    $('message').innerHTML =
      `<div class="err">
        送信に失敗しました。<br>
        ${String(err.message || err)}<br><br>
        確認事項：<br>
        ・GAS URLが /exec で終わっているか<br>
        ・デプロイで「新しいバージョン」を作成したか<br>
        ・アクセスできるユーザーが「全員」になっているか<br>
        ・ブラウザの開発者ツール → Network でリクエスト結果を確認
      </div>`;
    updateStatus();
  }
}

// ============================================================
// 起動
// ============================================================
function init(){
  $('gasUrl').value = localStorage.getItem(KEY) || '';
  renderStoreGrid();
  displayNow();

  // 前回選択していた店舗・従業員があれば、そのまま出退勤画面へ
  try{
    const last = JSON.parse(localStorage.getItem(LAST_KEY) || 'null');
    if(last && last.store && last.name && EMP.some(x => x[0] === last.store && x[1] === last.name)){
      currentStore = last.store;
      currentName = last.name;
      $('headerTitle').textContent = currentStore + '調剤薬局';
      $('selectedLabel').textContent = `【${currentStore}】${currentName} さん`;
      showStep('punchStep');
      updateStatus();
      return;
    }
  }catch(_){}

  showStep('storeStep');
}

init();
</script>
</body>
</html>
