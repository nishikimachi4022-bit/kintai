<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1769d1">
<title>勤怠打刻</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#eef3f8;
  color:#17212b;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif
}
.app{
  max-width:520px;
  margin:auto;
  min-height:100vh;
  background:#fff
}
header{
  padding:14px 16px;
  border-bottom:1px solid #dde5ee;
  position:sticky;
  top:0;
  background:#fff;
  z-index:5
}
.head{
  display:flex;
  justify-content:space-between;
  align-items:center
}
h1{
  font-size:21px;
  margin:0
}
.clock{
  text-align:right;
  font-size:13px;
  color:#667085
}
main{
  padding:15px
}
.card{
  border:1px solid #dbe3ec;
  border-radius:16px;
  padding:15px;
  margin-bottom:13px
}
.label{
  font-size:12px;
  font-weight:700;
  color:#667085;
  margin-bottom:7px
}
select{
  width:100%;
  height:50px;
  border:1px solid #cbd5e1;
  border-radius:12px;
  font-size:17px;
  padding:0 12px;
  background:#fff
}
.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:11px;
  margin-top:12px
}
.punch{
  height:105px;
  border:0;
  border-radius:16px;
  color:#fff;
  font-size:21px;
  font-weight:800
}
.punch small{
  display:block;
  font-size:11px;
  margin-top:6px;
  font-weight:500
}
.in{
  background:#16834b
}
.out{
  background:#d9342b
}
.punch:disabled{
  background:#c9d1da
}
.status{
  margin-top:12px;
  font-size:13px;
  line-height:1.7;
  color:#475467
}
.ok{
  color:#147a42;
  font-weight:700
}
.err{
  color:#c62828;
  font-weight:700
}
.notice{
  background:#f5f8fb;
  border-radius:12px;
  padding:11px;
  font-size:12px;
  line-height:1.7;
  color:#475467
}
.setting{
  display:flex;
  gap:7px
}
.setting input{
  flex:1;
  min-width:0;
  height:44px;
  border:1px solid #cbd5e1;
  border-radius:10px;
  padding:0 9px
}
.setting button,
.subbtn{
  height:44px;
  border:0;
  border-radius:10px;
  padding:0 14px;
  background:#1769d1;
  color:#fff;
  font-weight:700
}
.success{
  background:#edf9f1;
  border:1px solid #bfe5cb;
  border-radius:12px;
  padding:10px;
  font-size:13px;
  color:#176b38;
  margin-top:10px
}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="head">
    <h1>勤怠打刻</h1>
    <div class="clock">
      <div id="time">--:--:--</div>
      <div id="today">----</div>
    </div>
  </div>
</header>
<main>
<section class="card">
  <div class="label">
    従業員を選択
  </div>
  <select id="employee"></select>
  <div id="status" class="status">
    今日の打刻状況を確認しています。
  </div>
</section>
<section class="card">
  <div class="label">
    本日の打刻
  </div>
  <div class="buttons">
    <button
      id="inBtn"
      class="punch in"
      onclick="punch('in')">
      出勤
      <small>
        出勤時にタップ
      </small>
    </button>
    <button
      id="outBtn"
      class="punch out"
      onclick="punch('out')">
      退勤
      <small>
        退勤時にタップ
      </small>
    </button>
  </div>
  <div id="message"></div>
</section>
<section class="card">
  <div class="notice">
    <strong>勤怠表への反映ルール</strong><br>
    ・出勤・退勤ボタンを押した実際の時刻は、全員分「打刻管理を貼る」シートへ記録されます。<br>
    ・錦町・入船・メルヘンの各店舗シートには、このアプリからは一切書き込みません。<br>
    ・根本さん：店舗シートの出勤時間は「打刻管理を貼る」の出勤打刻を参照する数式で表示されます。<br>
    ・根本さん以外：店舗シートの出勤時間はシフトの数式のままです（打刻の影響を受けません）。
  </div>
</section>
<section class="card">
  <div class="label">
    Google Apps Script URL
  </div>
  <div class="setting">
    <input
      id="gasUrl"
      placeholder="https://script.google.com/macros/s/.../exec">
    <button onclick="saveUrl()">
      保存
    </button>
  </div>
  <div id="urlMsg" class="status"></div>
</section>
</main>
</div>
<script>
// ============================================================
// 従業員一覧
// ============================================================
const EMP = [
  ['錦町','神野'],
  ['錦町','横川'],
  ['錦町','渡邉'],
  ['錦町','戸澤'],
  ['錦町','松本'],
  ['錦町','根本'],
  ['入船','小野寺'],
  ['入船','増見'],
  ['入船','阿部'],
  ['入船','渡邊'],
  ['メルヘン','齊藤'],
  ['メルヘン','大橋'],
  ['メルヘン','福井'],
  ['メルヘン','小谷']
];
const KEY = '勤怠GAS_URL';
const PUNCH_KEY = '勤怠打刻状態'; // 当日の打刻状態を保存
const $ = id => document.getElementById(id);

// ============================================================
// 2桁表示
// ============================================================
function pad(n){
  return String(n).padStart(2,'0');
}

// ============================================================
// 今日の日付 YYYY-MM-DD
// ============================================================
function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}

// ============================================================
// 現在時刻
// ============================================================
function displayNow(){
  const d = new Date();
  $('time').textContent =
    `${pad(d.getHours())}:` +
    `${pad(d.getMinutes())}:` +
    `${pad(d.getSeconds())}`;
  $('today').textContent =
    `${d.getFullYear()}/` +
    `${pad(d.getMonth()+1)}/` +
    `${pad(d.getDate())}`;
  setTimeout(displayNow,1000);
}

// ============================================================
// 選択中の従業員 [store, name]
// ============================================================
function selected(){
  const i = $('employee').selectedIndex;
  return EMP[i];
}

// ============================================================
// 打刻状態の読み書き（localStorage）
// 形式: { "2026-03-18_錦町_神野": { in: true, out: true, inTime: "09:00", outTime: "18:00" } }
// ============================================================
function punchStateKey(store, name, date){
  return `${date}_${store}_${name}`;
}

function getPunchState(store, name, date){
  try{
    const all = JSON.parse(localStorage.getItem(PUNCH_KEY) || '{}');
    return all[punchStateKey(store, name, date)] || { in: false, out: false };
  }catch(_){
    return { in: false, out: false };
  }
}

function setPunchState(store, name, date, partial){
  try{
    const all = JSON.parse(localStorage.getItem(PUNCH_KEY) || '{}');
    const key = punchStateKey(store, name, date);
    all[key] = Object.assign({}, all[key] || {}, partial);
    // 古い日付のゴミを軽く掃除（30日超）
    const cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - 30);
    Object.keys(all).forEach(k => {
      const d = k.split('_')[0];
      if(d && new Date(d) < cutoff) delete all[k];
    });
    localStorage.setItem(PUNCH_KEY, JSON.stringify(all));
  }catch(_){}
}

// ============================================================
// 初期化
// ============================================================
function init(){
  const s = $('employee');
  const last = localStorage.getItem('勤怠従業員') || '神野';

  ['錦町','入船','メルヘン'].forEach(store => {
    const g = document.createElement('optgroup');
    g.label = store;
    EMP.filter(x => x[0] === store).forEach(x => {
      const o = document.createElement('option');
      o.value = x[1];
      o.textContent = x[1];
      g.appendChild(o);
    });
    s.appendChild(g);
  });

  s.value = last;
  s.onchange = () => {
    localStorage.setItem('勤怠従業員', s.value);
    updateStatus();
  };

  $('gasUrl').value = localStorage.getItem(KEY) || '';
  displayNow();
  updateStatus();
}

// ============================================================
// ステータス＆ボタン状態の更新
// 出勤・退勤は何回でも押せる（最新時刻で上書き）
// ============================================================
function updateStatus(){
  const e = selected();
  if(!e) return;

  const store = e[0];
  const name = e[1];
  const date = todayStr();
  const st = getPunchState(store, name, date);

  let msg = `${store}・${name}さんを選択中。出勤・退勤は何度でも押せます（最新時刻で上書きされます）。`;

  if(st.in || st.out){
    const parts = [];
    if(st.in && st.inTime) parts.push(`直近の出勤：${st.inTime}`);
    if(st.out && st.outTime) parts.push(`直近の退勤：${st.outTime}`);
    if(parts.length) msg += ` ${parts.join(' / ')}`;
  }

  $('status').textContent = msg;

  // 常に両方押せる
  $('inBtn').disabled = false;
  $('outBtn').disabled = false;
}

// ============================================================
// GAS URL保存
// ============================================================
function saveUrl(){
  const url = $('gasUrl').value.trim();
  if(!url){
    $('urlMsg').className = 'status err';
    $('urlMsg').textContent = 'GAS URLを入力してください。';
    return;
  }
  if(!url.includes('/macros/s/') || !url.endsWith('/exec')){
    $('urlMsg').className = 'status err';
    $('urlMsg').textContent = 'URLは https://script.google.com/macros/s/.../exec の形式にしてください。';
    return;
  }
  localStorage.setItem(KEY, url);
  $('urlMsg').className = 'status ok';
  $('urlMsg').textContent = 'GAS URLを保存しました。ブラウザでURLを開いて「稼働中」と出るか確認してください。';
}

// ============================================================
// 打刻
// 出勤・退勤は何回でも押せる。押すたびに最新時刻で上書きする
//
// ★送信形式について★
// JSON文字列をそのまま body に渡し、Content-Type はあえて指定しない。
// → その結果ブラウザは "text/plain;charset=UTF-8" を自動で付ける
//    （これは CORS の「シンプルリクエスト」に該当するため、
//    プリフライト(OPTIONS)が発生せず、GAS Web App にそのまま届く）
// → GAS側の parsePostData_() は e.postData.contents を JSON.parse
//    しているので、この形式で問題なく受け取れる。
// ============================================================
async function punch(action){
  const url =
    localStorage.getItem(KEY) ||
    $('gasUrl').value.trim();

  if(!url){
    alert('先にGoogle Apps Script URLを設定してください。');
    return;
  }

  const e = selected();
  if(!e){
    alert('従業員を選択してください。');
    return;
  }

  const store = e[0];
  const name = e[1];
  const d = new Date();
  const date =
    `${d.getFullYear()}-` +
    `${pad(d.getMonth()+1)}-` +
    `${pad(d.getDate())}`;
  const time =
    `${pad(d.getHours())}:` +
    `${pad(d.getMinutes())}`;

  // 送信データ（JSON）
  const payload = {
    date: date,
    store: store,
    name: name,
    in: '',
    out: ''
  };

  if(action === 'in'){
    // 「打刻管理を貼る」シートには全員分、実際に押した時刻を送る。
    // 店舗シート（錦町/入船/メルヘン）の出勤欄はこのアプリからは
    // 一切変更しないので、全員分ログに送っても安全。
    payload.in = time;
  }else{
    payload.out = time;
  }

  // 送信中だけ一時的に無効化（連打防止）。完了後は必ず有効に戻す
  $('inBtn').disabled = true;
  $('outBtn').disabled = true;
  $('message').innerHTML =
    `<div class="status">${action === 'in' ? '出勤' : '退勤'}を送信しています…</div>`;

  try{
    const res = await fetch(url, {
      method: 'POST',
      mode: 'cors',
      redirect: 'follow',
      body: JSON.stringify(payload)
      // Content-Type は指定しない（プリフライト回避のため）
    });

    const text = await res.text();
    let data;
    try{
      data = JSON.parse(text);
    }catch(_){
      throw new Error(
        'GASからの応答がJSONではありません。デプロイ設定・URLを確認してください。本文: ' +
        text.slice(0, 200)
      );
    }

    if(data.status !== 'ok'){
      throw new Error(data.message || 'GAS側でエラーが発生しました');
    }

    // 成功：直近時刻を記録（表示用）。ページ更新なしでその場で状態を反映する
    if(action === 'in'){
      setPunchState(store, name, date, {
        in: true,
        inTime: time
      });
      $('message').innerHTML =
        `<div class="success">
          出勤を記録しました（最新時刻で上書き）。<br>
          日時：${date} ${time}<br>
          店舗：${store}<br>
          氏名：${name}
        </div>`;
    }else{
      setPunchState(store, name, date, {
        out: true,
        outTime: time
      });
      $('message').innerHTML =
        `<div class="success">
          退勤を記録しました（最新時刻で上書き）。<br>
          日時：${date} ${time}<br>
          店舗：${store}<br>
          氏名：${name}
        </div>`;
    }

    // ボタンを再び有効化（何回でも押せる）。ページ更新は不要。
    updateStatus();

  }catch(err){
    console.error(err);
    $('message').innerHTML =
      `<div class="status err">
        送信に失敗しました。<br>
        ${String(err.message || err)}<br><br>
        確認事項：<br>
        ・GAS URLが /exec で終わっているか<br>
        ・デプロイで「新しいバージョン」を作成したか<br>
        ・アクセスできるユーザーが「全員」になっているか<br>
        ・ブラウザの開発者ツール → Network でリクエスト結果を確認
      </div>`;
    // 失敗時もボタンを有効に戻す
    updateStatus();
  }
}

// ============================================================
// 起動
// ============================================================
init();
</script>
</body>
</html>
