<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>勤怠打刻システム</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f4f6f8;
      color: #333;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: #ffffff;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    h1 {
      font-size: 1.4rem;
      text-align: center;
      margin-bottom: 20px;
      color: #2c3e50;
    }

    /* --------------------------------------------------
     * 大きな通知バナーのスタイル
     * -------------------------------------------------- */
    #notice-banner {
      display: none;
      background-color: #e6f4ea; /* マイルドなミントグリーン */
      color: #137333;
      border: 2px solid #34a853;
      border-radius: 12px;
      padding: 20px 16px;
      margin-bottom: 20px;
      font-size: 1.4rem; /* 大きなフォント */
      font-weight: bold;
      text-align: center;
      line-height: 1.4;
      box-shadow: 0 4px 12px rgba(52, 168, 83, 0.15);
      transition: opacity 0.3s ease;
      opacity: 0;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
      font-size: 0.95rem;
      color: #555;
    }

    select {
      width: 100%;
      padding: 14px;
      font-size: 1.1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      background-color: #fff;
      appearance: none;
      cursor: pointer;
    }

    select:focus {
      outline: none;
      border-color: #1a73e8;
    }

    .button-group {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    .btn {
      flex: 1;
      padding: 18px;
      font-size: 1.2rem;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-in {
      background-color: #1a73e8;
      color: white;
    }

    .btn-in:hover {
      background-color: #1557b0;
    }

    .btn-out {
      background-color: #ea4335;
      color: white;
    }

    .btn-out:hover {
      background-color: #c5221f;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>勤怠打刻</h1>

    <!-- 視認性の高い大きな通知エリア -->
    <div id="notice-banner"></div>

    <form id="attendance-form" onsubmit="return false;">
      <div class="form-group">
        <label for="store-select">店舗を選択</label>
        <select id="store-select" onchange="updateEmployeeOptions()">
          <option value="">-- 店舗を選択してください --</option>
          <option value="錦町">錦町</option>
          <option value="入船">入船</option>
          <option value="メルヘン">メルヘン</option>
        </select>
      </div>

      <div class="form-group">
        <label for="name-select">従業員を選択</label>
        <select id="name-select">
          <option value="">-- 先に店舗を選択してください --</option>
        </select>
      </div>

      <div class="button-group">
        <button type="button" class="btn btn-in" onclick="submitAttendance('in')">出勤</button>
        <button type="button" class="btn btn-out" onclick="submitAttendance('out')">退勤</button>
      </div>
    </form>
  </div>

  <script>
    // ==================================================
    // 【設定】デプロイしたGoogle Apps ScriptのWebアプリURLを入力してください
    // ==================================================
    const GAS_WEBAPP_URL = "https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec";

    // 各店舗の従業員リスト（STORE_LAYOUTと一致させる）
    const EMPLOYEES_BY_STORE = {
      "錦町": ["神野", "横川", "渡邉", "戸澤", "松本", "根本"],
      "入船": ["小野寺", "増見", "阿部", "渡邊"],
      "メルヘン": ["齊藤", "大橋", "福井", "小谷"]
    };

    /**
     * 店舗選択変更時に従業員の選択肢を更新する
     */
    function updateEmployeeOptions() {
      const storeSelect = document.getElementById("store-select");
      const nameSelect = document.getElementById("name-select");
      const selectedStore = storeSelect.value;

      nameSelect.innerHTML = "";

      if (!selectedStore || !EMPLOYEES_BY_STORE[selectedStore]) {
        nameSelect.innerHTML = '<option value="">-- 先に店舗を選択してください --</option>';
        return;
      }

      const defaultOpt = document.createElement("option");
      defaultOpt.value = "";
      defaultOpt.textContent = "-- 氏名を選択してください --";
      nameSelect.appendChild(defaultOpt);

      EMPLOYEES_BY_STORE[selectedStore].forEach(name => {
        const opt = document.createElement("option");
        opt.value = name;
        opt.textContent = name;
        nameSelect.appendChild(opt);
      });
    }

    /**
     * 出勤／退勤ボタン押下時のメイン処理
     * @param {string} mode 'in' または 'out'
     */
    function submitAttendance(mode) {
      const storeSelect = document.getElementById("store-select");
      const nameSelect = document.getElementById("name-select");

      const store = storeSelect.value;
      const name = nameSelect.value;

      if (!store || !name) {
        alert("店舗と氏名の両方を選択してください。");
        return;
      }

      // 1. 日時の生成
      const now = new Date();
      const dateStr = formatDate(now);     // YYYY-MM-DD
      const timeStr = formatTime(now);     // HH:MM
      const fullDateTimeDisplay = `${formatDisplayDate(now)} ${timeStr}`;

      const typeLabel = mode === 'in' ? '出勤' : '退勤';

      // 2. 【即時処理】通知を大きく表示 ＆ フォーム要素をクリア
      showBigNotice(`${fullDateTimeDisplay} ${name} ${typeLabel}を記録しました`);
      resetForm();

      // 3. 【バックグラウンド処理】GASへ非同期送信（画面の完了を待たない）
      const payload = {
        date: dateStr,
        store: store,
        name: name
      };

      if (mode === 'in') {
        payload.in = timeStr;
      } else {
        payload.out = timeStr;
      }

      fetch(GAS_WEBAPP_URL, {
        method: "POST",
        mode: "no-cors", // GASのリダイレクトによるCORSエラー回避
        headers: {
          "Content-Type": "application/x-www-form-urlencoded"
        },
        body: new URLSearchParams(payload)
      })
      .then(() => {
        console.log("裏での記録処理が完了しました");
      })
      .catch(err => {
        console.error("記録エラー:", err);
      });
    }

    /**
     * 大きな通知メッセージを表示し、一定時間後にフェードアウトする
     */
    let noticeTimer = null;
    function showBigNotice(message) {
      const banner = document.getElementById("notice-banner");

      if (noticeTimer) clearTimeout(noticeTimer);

      banner.innerText = message;
      banner.style.display = "block";
      
      // レンダリング待ちを入れてフェードインさせる
      setTimeout(() => {
        banner.style.opacity = "1";
      }, 10);

      // 5秒後に消去
      noticeTimer = setTimeout(() => {
        banner.style.opacity = "0";
        setTimeout(() => {
          banner.style.display = "none";
        }, 300);
      }, 5000);
    }

    /**
     * 入力画面を初期状態に戻す（即時リセット）
     */
    function resetForm() {
      document.getElementById("store-select").value = "";
      updateEmployeeOptions();
    }

    // --- 補助関数（日付・時刻フォーマット） ---
    function formatDate(d) {
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    function formatDisplayDate(d) {
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yyyy}/${mm}/${dd}`;
    }

    function formatTime(d) {
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      return `${hh}:${mm}`;
    }
  </script>
</body>
</html>
